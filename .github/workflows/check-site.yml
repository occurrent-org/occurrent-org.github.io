# Builds the site on every pull request, so a broken link or page fails before it reaches main.
name: Check site

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - name: Test the scripts
        run: npm test

      - name: Build the site
        run: npm run build

      - name: Check that every link resolves and every old address still exists
        run: npm run check-links
