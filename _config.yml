occurrentversion: 0.34.0
repourl: https://github.com/occurrent/occurrent.github.io
description: Occurrent -  Event Sourcing Utilities for the JVM based on the CloudEvent specification
baseurl: "" # the subpath of your site, e.g. /blog

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed
plugins:
  - jekyll-sitemap
host: 0.0.0.0

# The new Starlight site lives in site/ until it replaces this one. The rest is the list GitHub Pages excludes by
# default, which setting exclude would otherwise replace.
exclude:
  - site/
  - CNAME
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
